name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check tag matches catalogue
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import json,os; assert os.environ['RELEASE_TAG'] == 'v' + json.load(open('catalogue.json'))['version']"
      - run: python scripts/build.py
      - run: python scripts/release.py
      - name: Publish downloadable packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --title "摩羯 Capri $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
